[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "haish-agent-remote"
version = "0.2.3"
description = "Mobile UI and authenticated adapter for a local Haish Agent runtime."
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "httpx",
    "uvicorn",
    "websockets>=15,<17",
    "aiortc==1.14.0",
    "av==16.1.0",
    "pyobjc-core==11.1; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa==11.1; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz==11.1; sys_platform == 'darwin'",
    "pyobjc-framework-ApplicationServices==11.1; sys_platform == 'darwin'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

