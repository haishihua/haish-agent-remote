[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "haish-agent-remote"
version = "0.2.2"
description = "Mobile UI and authenticated adapter for a local Haish Agent runtime."
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "httpx",
    "uvicorn",
    "websockets>=15,<17",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

