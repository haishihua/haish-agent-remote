name: Build unsigned iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: haish-agent-remote

    steps:
      - name: Check out Haish Remote
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: haish-agent-remote

      - name: Check out shared Haish client sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: haishihua/haish-agent
          # 桌面 0.0.20：手机端复用的 chat 执行 UI（行 / 时间线 / 工具卡 / 审批卡）
          # 就是这个 ref 上的版本。bump 前先在桌面检出里跑
          # `node /tmp/scan-desktop-imports.mjs` 式的符号核对（见 docs）。
          ref: 97aaa54a359eabd4f2a225868df5e19aac8baf9e
          path: haish-agent

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: haish-agent-remote/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Sync shared web branding
        run: sips -z 192 192 ../haish-agent/build/icon.png --out src/assets/penguin_logo_user.png

      - name: Build and sync Capacitor
        run: npm run mobile:sync

      - name: Build unsigned iOS app
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/haish-derived-data" \
            MARKETING_VERSION="1.${{ github.run_number }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build

      - name: Package IPA
        run: |
          mkdir -p "$RUNNER_TEMP/haish-ipa/Payload"
          cp -R "$RUNNER_TEMP/haish-derived-data/Build/Products/Release-iphoneos/App.app" \
            "$RUNNER_TEMP/haish-ipa/Payload/"
          cd "$RUNNER_TEMP/haish-ipa"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/haish-agent-remote/Haish-unsigned.ipa" Payload

      - name: Verify the packaged app registers its Capacitor plugins and carries both ends of the keyboard frame hook
        run: |
          unzip -p Haish-unsigned.ipa Payload/App.app/capacitor.config.json | tee /dev/stderr | python3 -c "import json, sys; classes = json.load(sys.stdin)['packageClassList']; assert 'PhotoPicker' in classes, f'the bundled config does not register the app-local plugins: {classes}'; assert 'KeyboardPlugin' in classes, f'the bundled config does not register the keyboard plugin that hides the form accessory bar: {classes}'"
          unzip -p Haish-unsigned.ipa Payload/App.app/Info.plist | python3 -c "import plistlib, sys; info = plistlib.loads(sys.stdin.buffer.read()); print('ipa version', info['CFBundleShortVersionString'], 'build', info['CFBundleVersion'])"
          # AppDelegate 转发的键盘 frame 事件名（src/ios-keyboard.js 监听的就是它）：iOS 换键盘时只发
          # UIKeyboardWillChangeFrameNotification，插件那边一声不响，靠这条通道把高度带过来。通道两端分别在
          # 二进制和 JS bundle 里，两处都查：只装了一半的包（名字对不上、或者 JS 是旧的）在这里就该拦下。
          unzip -p Haish-unsigned.ipa Payload/App.app/App | strings | grep -q haishKeyboardFrame \
            || { echo 'the app binary is missing the keyboard frame hook (haishKeyboardFrame) the web layer listens for'; exit 1; }
          unzip -p Haish-unsigned.ipa 'Payload/App.app/public/assets/*.js' | grep -q haishKeyboardFrame \
            || { echo 'the bundled web layer is missing the keyboard frame listener (haishKeyboardFrame) the app forwards'; exit 1; }

      - name: Upload IPA
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: Haish-unsigned-${{ github.sha }}
          path: haish-agent-remote/Haish-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
