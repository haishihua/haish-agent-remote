name: Build unsigned iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: haish-agent-remote

    steps:
      - name: Check out Haish Remote
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: haish-agent-remote

      - name: Check out shared Haish client sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: haishihua/haish-agent
          ref: 6f07dc16ec172a14bdbfd3b48392f514e2e8e036
          path: haish-agent

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: haish-agent-remote/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Sync shared web branding
        run: sips -z 192 192 ../haish-agent/build/icon.png --out src/assets/penguin_logo_user.png

      - name: Build and sync Capacitor
        run: npm run mobile:sync

      - name: Build unsigned iOS app
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/haish-derived-data" \
            MARKETING_VERSION="1.${{ github.run_number }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build

      - name: Package IPA
        run: |
          mkdir -p "$RUNNER_TEMP/haish-ipa/Payload"
          cp -R "$RUNNER_TEMP/haish-derived-data/Build/Products/Release-iphoneos/App.app" \
            "$RUNNER_TEMP/haish-ipa/Payload/"
          cd "$RUNNER_TEMP/haish-ipa"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/haish-agent-remote/Haish-unsigned.ipa" Payload

      - name: Verify the packaged app registers the app-local plugins
        run: |
          unzip -p Haish-unsigned.ipa Payload/App.app/capacitor.config.json | tee /dev/stderr | python3 -c "import json, sys; classes = json.load(sys.stdin)['packageClassList']; assert 'PhotoPicker' in classes, f'the bundled config does not register the app-local plugins: {classes}'"
          unzip -p Haish-unsigned.ipa Payload/App.app/Info.plist | python3 -c "import plistlib, sys; info = plistlib.load(sys.stdin.buffer); print('ipa version', info['CFBundleShortVersionString'], 'build', info['CFBundleVersion'])"

      - name: Upload IPA
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: Haish-unsigned-${{ github.sha }}
          path: haish-agent-remote/Haish-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
